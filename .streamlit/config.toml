[theme]
base = "light"
primaryColor = "#1750df"
backgroundColor = "#eef2f8"
secondaryBackgroundColor = "#e1e9f5"
textColor = "#1d2a3a"
font = "sans serif"

[server]
headless = true
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 200

[browser]
gatherUsageStats = false

[client]
showSidebarNavigation = false
toolbarMode = "minimal"
